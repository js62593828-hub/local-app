<style>
  .ltc { font-family: 'Malgun Gothic', sans-serif; color: #e5e5e5; }
  .ltc h2 { font-size: 15px; margin: 22px 0 10px; color: #7dd3fc; }
  .ltc h3 { font-size: 13.5px; margin: 16px 0 6px; color: #f5f5f5; }
  .ltc table { width: 100%; border-collapse: collapse; background: #1e1e1e; border-radius: 8px; overflow: hidden; }
  .ltc th, .ltc td { padding: 8px 10px; text-align: left; font-size: 12.5px; border-bottom: 1px solid #2a2a2a; vertical-align: top; }
  .ltc th { background: #262626; font-weight: 600; color: #f5f5f5; font-size: 12px; }
  .ltc .muted { color: #888; font-size: 12px; }
  .ltc .warn { color: #fbbf24; }
  .ltc .ok { color: #4ade80; }
  .ltc .bad { color: #f87171; }
  .ltc .box { border-radius: 8px; padding: 12px 14px; font-size: 13px; line-height: 1.7; margin: 10px 0; }
  .ltc .box.err { background: #2a1515; border: 1px solid #6b2222; }
  .ltc .box.good { background: #10241a; border: 1px solid #1a4a30; }
  .ltc .box.info { background: #12283f; border: 1px solid #1e3a5f; }
  .ltc .box.warnbox { background: #2a2310; border: 1px solid #6b5a22; }
  .ltc .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 4px 0 10px; }
  .ltc .pair div { background: #181818; border: 1px solid #2a2a2a; border-radius: 6px; padding: 7px 9px; font-size: 12px; line-height: 1.6; word-break: break-all; }
  .ltc .pair .b { border-color: #6b2222; }
  .ltc .pair .a { border-color: #1a4a30; }
  .ltc code { font-family: Consolas, monospace; font-size: 12px; }
</style>
