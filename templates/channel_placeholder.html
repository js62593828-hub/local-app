<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>{{ channel_label }} — 준비 중</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #121212; color: #e5e5e5;
    font-family: 'Malgun Gothic', sans-serif;
  }
  .app-shell { display: flex; min-height: 100vh; }

  .main-content { flex: 1; min-width: 0; padding: 32px 40px 60px; }
  .container { max-width: 900px; margin: 0 auto; }

  .placeholder-box {
    background: #1a1a1a; border: 1px dashed #3a3a3a; border-radius: 12px;
    padding: 60px 40px; text-align: center; margin-top: 40px;
  }
  .placeholder-box .icon { font-size: 40px; margin-bottom: 16px; }
  .placeholder-box h2 { margin: 0 0 10px; font-size: 20px; color: #e5e5e5; }
  .placeholder-box p { color: #999; font-size: 14px; line-height: 1.7; margin: 0; }
</style>
</head>
<body>
<div class="app-shell">
  {% include "_sidebar.html" %}

  <div class="main-content">
  <div class="container">
    <div class="placeholder-box">
      <div class="icon">🚧</div>
      <h2>{{ channel_label }} — 아직 준비 중입니다</h2>
      <p>이 채널은 다음 단계에서 만들어질 예정입니다.<br>지금은 "롱텀 워드프레스" 채널만 사용 가능합니다.</p>
    </div>
  </div>
  </div>
</div>
</body>
</html>
